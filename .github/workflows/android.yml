name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  qa-verification:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      RAAD_KEYSTORE_PASSWORD: ${{ secrets.RAAD_KEYSTORE_PASSWORD }}
      RAAD_KEY_ALIAS: ${{ secrets.RAAD_KEY_ALIAS }}
      RAAD_KEY_PASSWORD: ${{ secrets.RAAD_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Prepare private production signing key when configured
        env:
          RAAD_SIGNING_KEYSTORE_BASE64: ${{ secrets.RAAD_SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$RAAD_SIGNING_KEYSTORE_BASE64" ]; then
            umask 077
            printf %s "$RAAD_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/raad-release.jks"
            echo "RAAD_KEYSTORE_PATH=$RUNNER_TEMP/raad-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Verify stable version metadata
        shell: bash
        run: |
          grep -q 'versionName = "3.3.16"' app/build.gradle.kts
          grep -q 'versionCode = 48' app/build.gradle.kts
          if grep -q 'versionName = ".*-rc' app/build.gradle.kts; then
            echo "Release candidate suffix is still present."
            exit 1
          fi

      - name: Run unit, Room and Compose tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run release lint
        run: gradle :app:lintRelease --stacktrace

      - name: Build optimized QA APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Generate APK checksum
        run: sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raad-pharmacy-v3.3.16-qa-reports
          path: |
            app/build/reports/navigation-preview/
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml
          if-no-files-found: ignore

      # CI artifacts are not official releases and may be debug-signed; never update phones using these.
      - name: Upload QA-only APK
        uses: actions/upload-artifact@v4
        with:
          name: raad-pharmacy-v3.3.16-qa-only-not-for-update
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
