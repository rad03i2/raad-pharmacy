name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  stable-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify stable version metadata
        shell: bash
        run: |
          grep -q 'versionName = "3.3.2"' app/build.gradle.kts
          grep -q 'versionCode = 33' app/build.gradle.kts
          if grep -q 'versionName = ".*-rc' app/build.gradle.kts; then
            echo "Release candidate suffix is still present."
            exit 1
          fi

      - name: Run unit, Room and Compose tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run release lint
        run: gradle :app:lintRelease --stacktrace

      - name: Build optimized stable APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Generate APK checksum
        run: sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raad-pharmacy-v3.3.2-qa-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml
          if-no-files-found: ignore

      - name: Upload stable APK
        uses: actions/upload-artifact@v4
        with:
          name: raad-pharmacy-v3.3.2-stable-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
