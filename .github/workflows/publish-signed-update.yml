name: Publish signed Android update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RAAD_KEYSTORE_PASSWORD: ${{ secrets.RAAD_KEYSTORE_PASSWORD }}
      RAAD_KEY_ALIAS: ${{ secrets.RAAD_KEY_ALIAS }}
      RAAD_KEY_PASSWORD: ${{ secrets.RAAD_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require stable private signing key (never publish debug-signed APKs)
        env:
          KEYSTORE_BASE64: ${{ secrets.RAAD_SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for secret in "$KEYSTORE_BASE64" "$RAAD_KEYSTORE_PASSWORD" "$RAAD_KEY_ALIAS" "$RAAD_KEY_PASSWORD"; do
            if [ -z "$secret" ]; then
              echo "::error::Production signing secrets are incomplete. Refusing to publish an incompatible APK."
              exit 1
            fi
          done
          umask 077
          printf %s "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/raad-release.jks"
          echo "RAAD_KEYSTORE_PATH=$RUNNER_TEMP/raad-release.jks" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Test, lint and build production-signed APK
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --stacktrace

      - name: Verify signature, previous signer and monotonically increasing version
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          signer=$("$build_tools/apksigner" verify --print-certs "$apk" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          if ! [[ "$signer" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::APK signature check failed."
            exit 1
          fi
          version=$(sed -n 's/^ *versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts | head -n 1)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$code" =~ ^[0-9]+$ ]]; then
            echo "::error::Version metadata invalid."
            exit 1
          fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::This version was already published. Do not replace signed release assets."
            exit 1
          fi
          previous=$(gh api repos/"$GITHUB_REPOSITORY"/releases/latest --jq '.tag_name' 2>/dev/null || true)
          if [ -n "$previous" ]; then
            mkdir -p "$RUNNER_TEMP/previous"
            gh release download "$previous" --pattern 'Raad-Pharmacy-*.apk' --dir "$RUNNER_TEMP/previous"
            previous_apk=$(find "$RUNNER_TEMP/previous" -name '*.apk' -print -quit)
            if [ -z "$previous_apk" ]; then
              echo "::error::Previous release APK unavailable; cannot verify signing continuity."
              exit 1
            fi
            previous_signer=$("$build_tools/apksigner" verify --print-certs "$previous_apk" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
            if [ "$signer" != "$previous_signer" ]; then
              echo "::error::Signing certificate changed! In-place Android updates would fail."
              exit 1
            fi
            old_code=$(gh release view "$previous" --json body --jq .body |
              sed -n 's/^VersionCode: \([0-9]*\)$/\1/p' | head -n 1)
            if [ -z "$old_code" ] || [ "$code" -le "$old_code" ]; then
              echo "::error::New versionCode must be greater than the last published version."
              exit 1
            fi
          fi
          cp "$apk" "Raad-Pharmacy-$tag.apk"
          sha256sum "Raad-Pharmacy-$tag.apk" > "Raad-Pharmacy-$tag.apk.sha256"
          {
            echo "VersionCode: $code"
            echo "SigningCertificateSHA256: $signer"
            echo
            echo "تحديث مستقر لدفتر صيدلية رعد."
            echo "يتحقق التطبيق من بصمة SHA-256 وشهادة التوقيع قبل بدء تثبيت النسخة الجديدة."
          } > "$RUNNER_TEMP/release-notes.txt"
          echo "RAAD_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RAAD_RELEASE_NOTES=$RUNNER_TEMP/release-notes.txt" >> "$GITHUB_ENV"

      - name: Publish immutable GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RAAD_RELEASE_TAG" \
            "Raad-Pharmacy-$RAAD_RELEASE_TAG.apk" \
            "Raad-Pharmacy-$RAAD_RELEASE_TAG.apk.sha256" \
            --title "دفتر صيدلية رعد $RAAD_RELEASE_TAG" \
            --notes-file "$RAAD_RELEASE_NOTES" \
            --target "$GITHUB_SHA"
