name: Publish signed Android update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RAAD_KEYSTORE_PASSWORD: ${{ secrets.RAAD_KEYSTORE_PASSWORD }}
      RAAD_KEY_ALIAS: ${{ secrets.RAAD_KEY_ALIAS }}
      RAAD_KEY_PASSWORD: ${{ secrets.RAAD_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check whether publishing is needed
        id: gate
        env:
          SIGNING_B64: ${{ secrets.RAAD_SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ *versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo '::error::Invalid version number'; exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo 'Official release already exists: skipping.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          elif [ -z "$SIGNING_B64" ] || [ -z "$RAAD_KEYSTORE_PASSWORD" ] ||
               [ -z "$RAAD_KEY_ALIAS" ] || [ -z "$RAAD_KEY_PASSWORD" ]; then
            if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
              echo '::error::Signing secrets are missing. Set them before publication.'; exit 1
            fi
            echo 'No production secrets yet; skipping publication without failing CI.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Require stable private signing key (never publish debug-signed APKs)
        if: steps.gate.outputs.publish == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RAAD_SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for secret in "$KEYSTORE_BASE64" "$RAAD_KEYSTORE_PASSWORD" "$RAAD_KEY_ALIAS" "$RAAD_KEY_PASSWORD"; do
            if [ -z "$secret" ]; then
              echo "::error::Production signing secrets are incomplete. Refusing to publish an incompatible APK."
              exit 1
            fi
          done
          umask 077
          printf %s "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/raad-release.jks"
          echo "RAAD_KEYSTORE_PATH=$RUNNER_TEMP/raad-release.jks" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        if: steps.gate.outputs.publish == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.gate.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Test, lint and build production-signed APK
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          # Room debug/release KSP tasks share the schema directory; one worker prevents concurrent schema writes.
          gradle --max-workers=1 :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --stacktrace

      - name: Set up Deno for dispatcher verification
        if: steps.gate.outputs.publish == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify dispatcher type safety, privacy and bounded recovery before publication
        if: steps.gate.outputs.publish == 'true'
        run: |
          deno check supabase/functions/send-financial-notification/index.ts
          deno test supabase/functions/send-financial-notification/*_test.ts
          node --test supabase/tests/closed-app-payload.test.mjs

      - name: Verify signature, previous signer and monotonically increasing version
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          # Verify the APK cryptographically before reading its public signer fingerprint.
          cert_report=$("$build_tools/apksigner" verify --verbose --print-certs "$apk")
          # Android Build Tools 37 may report "V2 Signer: certificate SHA-256 digest:"
          # instead of the older "Signer #1 certificate SHA-256 digest:".
          # Collect ALL APK signer digests: accept exactly one unique certificate.
          signer=$(printf '%s\n' "$cert_report" |
            sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*([[:xdigit:]]{64}).*$/\1/p' |
            tr '[:upper:]' '[:lower:]' | sort -u)
          pinned=$(tr -d '\r\n[:space:]' < docs/production-signing-certificate.sha256 | tr '[:upper:]' '[:lower:]')
          # Cross-check the keystore itself, so extraction failures cannot be
          # mistaken for a wrong private key. SHA-256 certificate hashes are public.
          key_signer=$(keytool -exportcert -rfc \
            -keystore "$RAAD_KEYSTORE_PATH" -alias "$RAAD_KEY_ALIAS" \
            -storepass:env RAAD_KEYSTORE_PASSWORD |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if ! [[ "$signer" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Could not parse the APK signing certificate from apksigner output."
            printf '%s\n' "$cert_report" | grep -E 'certificate SHA-256 digest:' || true
            exit 1
          fi
          if ! [[ "$pinned" =~ ^[a-f0-9]{64}$ ]] || ! [[ "$key_signer" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Could not read pinned/keystore certificate SHA-256."
            exit 1
          fi
          echo "APK certificate SHA-256: $signer"
          echo "Keystore certificate SHA-256: $key_signer"
          echo "Pinned certificate SHA-256: $pinned"
          if [ "$key_signer" != "$pinned" ]; then
            echo "::error::Private signing keystore does not match pinned certificate. Refusing publication."
            exit 1
          fi
          if [ "$signer" != "$key_signer" ]; then
            echo "::error::Built APK was signed with an unexpected key. Refusing publication."
            exit 1
          fi
          version=$(sed -n 's/^ *versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts | head -n 1)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ && "$code" =~ ^[0-9]+$ ]]; then
            echo "::error::Version metadata invalid."
            exit 1
          fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::This version was already published. Do not replace signed release assets."
            exit 1
          fi
          # The GitHub /releases/latest endpoint returns "release not found"
          # when the repository has no releases; do not treat that as a tag.
          # release list returns [] without failing on the FIRST published version.
          previous=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$previous" ]; then
            if ! [[ "$previous" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo "::error::Previous release tag is malformed. Refusing publication."
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/previous"
            gh release download "$previous" --pattern 'Raad-Pharmacy-*.apk' --dir "$RUNNER_TEMP/previous"
            previous_apk=$(find "$RUNNER_TEMP/previous" -name '*.apk' -print -quit)
            if [ -z "$previous_apk" ]; then
              echo "::error::Previous release APK unavailable; cannot verify signing continuity."
              exit 1
            fi
            previous_report=$("$build_tools/apksigner" verify --verbose --print-certs "$previous_apk")
            previous_signer=$(printf '%s\n' "$previous_report" |
              sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*([[:xdigit:]]{64}).*$/\1/p' |
              tr '[:upper:]' '[:lower:]' | sort -u)
            if ! [[ "$previous_signer" =~ ^[a-f0-9]{64}$ ]]; then
              echo "::error::Could not verify a unique signer for previous release APK."
              exit 1
            fi
            if [ "$signer" != "$previous_signer" ]; then
              echo "::error::Signing certificate changed! In-place Android updates would fail."
              exit 1
            fi
            old_code=$(gh release view "$previous" --json body --jq .body |
              sed -n 's/^VersionCode: \([0-9]*\)$/\1/p' | head -n 1)
            if [ -z "$old_code" ] || [ "$code" -le "$old_code" ]; then
              echo "::error::New versionCode must be greater than the last published version."
              exit 1
            fi
          fi
          cp "$apk" "Raad-Pharmacy-$tag.apk"
          sha256sum "Raad-Pharmacy-$tag.apk" > "Raad-Pharmacy-$tag.apk.sha256"
          {
            echo "VersionCode: $code"
            echo "SigningCertificateSHA256: $signer"
            echo
            echo "تحديث 3.3.22.1: إزالة حساب العرض الإعلامي نهائيًا، وإصلاح مشاركة صورة كشف الحساب والنص الجاهز المناسب لمدة الدين عبر واتساب دون فتح محادثة فارغة."
            echo "إمكانية تخصيص النصوص من الإعدادات الإضافية مع المبلغ بالأرقام والكتابة."
            echo "إضافة موعد تسديد اختياري لكل دين وربطه بمسودة الحفظ والمزامنة والنسخ الاحتياطية دون مسح السجلات السابقة."
            echo "فلتر موعد خاص في شاشة المتابعة مع مراعاة التسديد الجزئي حسب الأقدم أولاً؛ وتبقى المتابعة الاعتيادية للديون دون موعد خاص بعد 30 يومًا."
            echo "يستمر التحقق من بصمة SHA-256 وشهادة التوقيع قبل تثبيت أي تحديث."
          } > "$RUNNER_TEMP/release-notes.txt"
          echo "RAAD_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RAAD_RELEASE_NOTES=$RUNNER_TEMP/release-notes.txt" >> "$GITHUB_ENV"
          # Attach the same small manifest to the release so the updater can use
          # github.com/releases/latest/download/latest.json without the GitHub API.
          apk_name="Raad-Pharmacy-$tag.apk"
          hash_name="$apk_name.sha256"
          apk_size=$(stat -c '%s' "$apk_name")
          hash_size=$(stat -c '%s' "$hash_name")
          body=$(cat "$RUNNER_TEMP/release-notes.txt")
          jq -n \
            --arg tag "$tag" \
            --arg body "$body" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg apk "$apk_name" \
            --arg hash "$hash_name" \
            --argjson apk_size "$apk_size" \
            --argjson hash_size "$hash_size" \
            '{
              tag_name: $tag,
              draft: false,
              prerelease: false,
              body: $body,
              assets: [
                {name: $apk, size: $apk_size, browser_download_url: ("https://github.com/" + $repo + "/releases/download/" + $tag + "/" + $apk)},
                {name: $hash, size: $hash_size, browser_download_url: ("https://github.com/" + $repo + "/releases/download/" + $tag + "/" + $hash)}
              ]
            }' > latest.json

      - name: Publish immutable GitHub Release
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          latest_head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest_head" != "$GITHUB_SHA" ]; then
            echo '::error::This build was superseded by a newer main commit; refusing to publish.'
            exit 1
          fi
          gh release create "$RAAD_RELEASE_TAG" \
            "Raad-Pharmacy-$RAAD_RELEASE_TAG.apk" \
            "Raad-Pharmacy-$RAAD_RELEASE_TAG.apk.sha256" \
            "latest.json" \
            --title "دفتر صيدلية رعد $RAAD_RELEASE_TAG" \
            --notes-file "$RAAD_RELEASE_NOTES" \
            --target "$GITHUB_SHA"

      - name: Publish update manifest for networks that cannot reach api.github.com
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="$RAAD_RELEASE_TAG"
          apk_name="Raad-Pharmacy-$tag.apk"
          hash_name="$apk_name.sha256"
          apk_size=$(stat -c '%s' "$apk_name")
          hash_size=$(stat -c '%s' "$hash_name")
          body=$(cat "$RAAD_RELEASE_NOTES")
          mkdir -p docs/updates
          jq -n \
            --arg tag "$tag" \
            --arg body "$body" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg apk "$apk_name" \
            --arg hash "$hash_name" \
            --argjson apk_size "$apk_size" \
            --argjson hash_size "$hash_size" \
            '{
              tag_name: $tag,
              draft: false,
              prerelease: false,
              body: $body,
              assets: [
                {name: $apk, size: $apk_size, browser_download_url: ("https://github.com/" + $repo + "/releases/download/" + $tag + "/" + $apk)},
                {name: $hash, size: $hash_size, browser_download_url: ("https://github.com/" + $repo + "/releases/download/" + $tag + "/" + $hash)}
              ]
            }' > docs/updates/latest.json
          api_path="repos/$GITHUB_REPOSITORY/contents/docs/updates/latest.json"
          content_b64=$(base64 -w0 docs/updates/latest.json)
          args=(--method PUT "$api_path" -f "message=Update signed release manifest for $tag" -f "content=$content_b64")
          existing_sha=$(gh api "$api_path" --jq .sha 2>/dev/null || true)
          if [ -n "$existing_sha" ]; then
            args+=(-f "sha=$existing_sha")
          fi
          gh api "${args[@]}" >/dev/null
